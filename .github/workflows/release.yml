name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: '--bundles deb,appimage'
          - platform: windows-latest
            args: ''
          # - platform: macos-latest
          #   args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Tauri)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 只装依赖：tauri-action 会执行 tauri.conf.json 里的 beforeBuildCommand（deno task build）。
      # 之前这里额外跑了一次 deno task build，等于每次发布都做两遍 vue-tsc 全量类型检查。
      - name: Install frontend deps
        run: deno install

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          tagName: "${{ github.event_name == 'push' && github.ref_name || format('ci-test-{0}', github.run_id) }}"
          releaseName: "RustWallhub ${{ github.event_name == 'push' && github.ref_name || github.run_id }}"
          releaseBody: |
            ## RustWallhub ${{ github.event_name == 'push' && github.ref_name || 'CI 测试构建' }}

            从 Wallhaven 和 Reddit 下载动漫壁纸的桌面管理器。

            ### 下载
            - Linux: 下载 `*.AppImage` 或 `*.deb` 安装
            - Windows: 下载 `*.msi` 或 `*-setup.exe` 安装

            ### 自动更新
            开启「设置 → 高级设置 → 启动时自动检查更新」后，应用会自动检测新版本。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
