name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Rust backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dsherret/rust-toolchain-file@v1

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --check

      # --all-targets 必须带上：默认只检查库/二进制，测试代码里的 lint 会被漏掉，
      # 时间一长测试就会先烂。本地开发跑的也是同一条命令。
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Windows 专用代码（winpath / trash 的 SHFileOperationW / current_wallpaper 的 COM
  # 查询）全在 #[cfg(windows)] 分支里，ubuntu 任务根本编不到它们；而若干真机回归测试
  # （回收站、IDesktopWallpaper 的 CLSID 与 vtable 槽位）只在 Windows 上执行。
  # 没有这个任务，这类改动只能等到打 tag 走 release 时才炸。
  backend-windows:
    name: Rust backend (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dsherret/rust-toolchain-file@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install deps
        run: deno install

      - name: Build (type-check + bundle)
        run: deno task build

      - name: Unit tests
        run: deno task test:unit

      - name: Install chromium (for the render check)
        run: npx playwright install --with-deps chromium

      # 把刚构建出来的产物真正加载起来跑一遍：断言每个视图都渲染出来了、没有未解析的
      # 组件标签、Vuetify 的 defaults 仍生效。Vue 的渲染期异常只走 console.error，
      # 光看 pageerror 抓不到整页白屏（ci 里加这一步就是为了这类问题不再漏网）。
      - name: Render check
        run: deno task test:render
